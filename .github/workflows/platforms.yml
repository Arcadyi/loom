name: Platform adapters

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Qt 6.11 split the Windows desktop repository from one qt6_<ver>/qt6_<ver>
# directory into a per-architecture qt6_<ver>/qt6_<ver>_<arch> layout. aqtinstall
# 3.3.0 -- the newest release, and what install-qt-action pulls by default --
# only knows the old shape and fails with "Failed to locate XML data for Qt
# version 6.11.1". The commit below teaches it the new one; drop the pin for the
# plain version spec once an aqtinstall release carries the fix.
env:
  LOOM_QT_VERSION: '6.11.*'
  LOOM_AQT_WINDOWS_SOURCE: >-
    git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_gcc_64
          - os: macos-latest
            arch: clang_64
          - os: windows-latest
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.LOOM_QT_VERSION }}
          arch: ${{ matrix.arch }}
          aqtsource: ${{ runner.os == 'Windows' && env.LOOM_AQT_WINDOWS_SOURCE || '' }}
          cache: true
      # The Visual Studio generator finds cl.exe by itself; Ninja takes whatever
      # compiler is first on PATH, and that is MinGW on windows-latest. Building
      # against the msvc2022_64 Qt then fails at link with Itanium-mangled
      # "undefined reference to __imp__ZN5QTest..." against MSVC import
      # libraries. This puts the MSVC toolchain in the environment instead.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOOM_WERROR=ON -DLOOM_BUILD_E2E_TESTS=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE e2e
        env:
          QT_QPA_PLATFORM: offscreen
      # --output-on-failure printed nothing at all for the failures on the
      # Windows runner. ctest records every test's output here regardless of
      # what it echoes, so this is the copy worth reading.
      - name: Test log
        if: failure()
        shell: bash
        # A failure before ctest ran leaves no log; that is not a second failure.
        run: cat build/Testing/Temporary/LastTest.log || true
      # ctest captures nothing from the Qt test binaries on Windows -- it logs
      # "<end of output>" even for the ones that pass -- so ask QTest for a file
      # instead, which does not go through the stdout that is coming up empty.
      - name: Qt test output
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          for name in tst_states tst_lsp; do
            [ -x "build/$name.exe" ] || continue
            echo "===== $name ====="
            "./build/$name.exe" -o "$name.txt,txt" || true
            cat "$name.txt" || true
          done

  android-emulator:
    name: Android emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.LOOM_QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Build and install host loom
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOOM_BUILD_E2E_TESTS=OFF
          cmake --build build-host
          cmake --install build-host --prefix "$RUNNER_TEMP/loom"
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.LOOM_QT_VERSION }}
          # Since Qt 6.8 the Android packages live in the host-agnostic `all_os`
          # repository. Left at the default `linux` host, aqtinstall reports "No
          # versions of Qt exist for spec=6.11.*" -- the last Android build it
          # can find under a linux host is 6.7.3.
          host: all_os
          target: android
          arch: android_x86_64
          cache: true
      # The application links loom's static libraries, so the host build above
      # -- which exists to provide the CLI -- cannot serve it. Build the library
      # for the device ABI and hand the CLI that prefix with --prefix.
      - name: Cross-build loom for Android
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_ABI=x86_64 \
            -DLOOM_BUILD_CLI=OFF \
            -DLOOM_BUILD_TESTS=OFF \
            -DLOOM_BUILD_E2E_TESTS=OFF \
            -DLOOM_BUILD_EXAMPLES=OFF
          cmake --build build-android
          cmake --install build-android --prefix "$RUNNER_TEMP/loom-android"
      - name: Generate adapter fixture
        run: |
          echo "QT_ANDROID_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/loom/bin/loom" new LoomAndroid --directory "$RUNNER_TEMP/LoomAndroid"
          cd "$RUNNER_TEMP/LoomAndroid"
          # api is the NDK's ANDROID_PLATFORM, not the emulator's image: NDK 27
          # rejects anything above 35 ("android-36 is above the maximum
          # supported version 35"), and a 35 minimum runs on the 36 emulator.
          jq --arg qt "$QT_ROOT_DIR" --arg host "$QT_HOST_PATH" '.applications.LoomAndroid.platforms.android = {qtPath: $qt, hostQtPath: $host, abi: "x86_64", api: 35}' loom.json > loom.next.json
          mv loom.next.json loom.json
      # ubuntu-latest ships /dev/kvm owned by a group the runner user is not in,
      # so the emulator falls back to software rendering and never boots:
      # "ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)".
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A file rather than inline commands: the emulator runner hands each line
      # of `script` to its own `sh -c`, so a `cd` on one line is gone by the
      # next and loom looks for loom.json in the wrong directory.
      - name: Write emulator script
        run: |
          cat > "$RUNNER_TEMP/android-smoke.sh" <<'SCRIPT'
          set -eu
          cd "$RUNNER_TEMP/LoomAndroid"
          loom="$RUNNER_TEMP/loom/bin/loom"
          "$loom" build --target android --config Debug --prefix "$RUNNER_TEMP/loom-android"
          "$loom" deploy --target android --config Debug --prefix "$RUNNER_TEMP/loom-android"
          # Ask the device what went on rather than naming a package and an
          # activity. loom does not set QT_ANDROID_PACKAGE_NAME, so the APK
          # keeps Qt's default identity instead of the manifest's organization,
          # and Qt has more than one QtActivity to choose between.
          package=$(adb shell pm list packages -3 | tr -d '\r' | sed 's/^package://' | head -n 1)
          [ -n "$package" ] || { echo "the APK installed no third-party package" >&2; exit 1; }
          activity=$(adb shell cmd package resolve-activity --brief \
            -c android.intent.category.LAUNCHER "$package" | tail -n 1 | tr -d '\r')
          case "$activity" in
            "$package"/*) ;;
            *) echo "no launcher activity for $package: $activity" >&2; exit 1 ;;
          esac
          adb shell am start -W -n "$activity"
          SCRIPT
          chmod +x "$RUNNER_TEMP/android-smoke.sh"
      - name: Build, install, and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: bash "$RUNNER_TEMP/android-smoke.sh"

  ios-simulator:
    name: iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.LOOM_QT_VERSION }}
          arch: clang_64
          cache: true
      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Build and install host loom
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOOM_BUILD_E2E_TESTS=OFF
          cmake --build build-host
          cmake --install build-host --prefix "$RUNNER_TEMP/loom"
      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.LOOM_QT_VERSION }}
          target: ios
          arch: ios
          cache: true
      # The application links loom's static libraries, so the host build above
      # -- which exists to provide the CLI -- cannot serve it. Build the library
      # for the simulator SDK and hand the CLI that prefix with --prefix.
      # Ninja rather than Xcode, even though the application itself needs Xcode:
      # loom exports object libraries, and installing those under Xcode either
      # refuses outright ("may not be installed under Xcode with multiple
      # architectures") or looks for the objects somewhere Xcode did not put
      # them. Ninja knows where its object files are. Only static libraries are
      # built here, so nothing wants the Xcode-only bundle handling.
      #
      # Both simulator architectures, matching Qt's own universal simulator
      # libraries: Xcode builds the application for every applicable one, so an
      # arm64-only loom leaves it undefined for x86_64.
      - name: Cross-build loom for iOS
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DLOOM_BUILD_CLI=OFF \
            -DLOOM_BUILD_TESTS=OFF \
            -DLOOM_BUILD_E2E_TESTS=OFF \
            -DLOOM_BUILD_EXAMPLES=OFF
          cmake --build build-ios
          cmake --install build-ios --prefix "$RUNNER_TEMP/loom-ios"
      - name: Generate and build adapter fixture
        run: |
          "$RUNNER_TEMP/loom/bin/loom" new LoomIos --directory "$RUNNER_TEMP/LoomIos"
          cd "$RUNNER_TEMP/LoomIos"
          jq --arg qt "$QT_ROOT_DIR" --arg host "$QT_HOST_PATH" '.applications.LoomIos.platforms.ios = {qtPath: $qt, hostQtPath: $host, sdk: "iphonesimulator", destination: "simulator", device: "booted"}' loom.json > loom.next.json
          mv loom.next.json loom.json
          "$RUNNER_TEMP/loom/bin/loom" build --target ios --config Debug --prefix "$RUNNER_TEMP/loom-ios"
          device=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable)][0].udid')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          jq --arg device "$device" '.applications.LoomIos.platforms.ios.device = $device' loom.json > loom.next.json
          mv loom.next.json loom.json
          "$RUNNER_TEMP/loom/bin/loom" deploy --target ios --config Debug --prefix "$RUNNER_TEMP/loom-ios"
          xcrun simctl launch "$device" dev.example.loomios
