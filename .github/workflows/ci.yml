name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# loom is validated on Linux only for now, matching what is actually tested.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          modules: qtdeclarative
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLOOM_WERROR=ON

      - name: Build
        run: cmake --build build

      # Split from the end-to-end tests so a consumer-build failure is never
      # confused with a unit-test failure.
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE e2e

      - name: End-to-end tests
        run: ctest --test-dir build --output-on-failure -L e2e

  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          modules: qtdeclarative
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLOOM_SANITIZE=ON
          -DLOOM_BUILD_E2E_TESTS=OFF

      - name: Build
        run: cmake --build build

      # One narrow leak suppression exists (tests/lsan.supp, wired through the
      # test ENVIRONMENT): libQt6QuickEffects leaks internally on any
      # RectangularShadow create/destroy, reproduced Loom-free. Everything
      # else, including leaks through QtQuick/QtQml frames, still fails here.
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE e2e
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: >
          find src include tests examples -name '*.cpp' -o -name '*.h'
          | xargs clang-format --dry-run --Werror
